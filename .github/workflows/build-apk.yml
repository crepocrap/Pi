
name: Build PixelForge FX APK

on:
  push:
    branches: [main, master]
    paths:
      - "PixelForgeFX-source.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f PixelForgeFX-source.zip
          unzip -t PixelForgeFX-source.zip
          mkdir -p extracted
          unzip -q PixelForgeFX-source.zip -d extracted
          test -f extracted/PixelForgeFX/settings.gradle.kts
          test -f extracted/PixelForgeFX/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: extracted/PixelForgeFX
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists
        run: test -s extracted/PixelForgeFX/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelForgeFX-debug-apk
          path: extracted/PixelForgeFX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
